[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "questionforge"
version = "1.0.0"
description = "Reproducible English, French and Arabic educational question generation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3", "transformers==4.57.6", "sentencepiece>=0.2,<0.3",
  "protobuf>=5,<7", "huggingface-hub>=0.34,<1", "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2", "sacrebleu>=2.4,<3", "pandas>=2.2,<3",
  "matplotlib>=3.9,<4", "streamlit>=1.40,<2", "pypdf>=5,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "python-pptx>=1,<2", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
train = ["accelerate>=1,<2"]

[project.scripts]
questionforge = "questionforge.cli:main"

[tool.setuptools.packages.find]
include = ["questionforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads and runs pretrained neural models"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
